name: Keepalive (Native)

on:
  schedule:
    - cron: '0 0 1 */1 *' # Runs on the 1st of every month
  workflow_dispatch: # Allows manual testing from the Actions tab

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required so the bot can push the commit back to your repo
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update keepalive log
        run: |
          # Append the current date and time to a hidden log file
          date +"Keepalive run at: %Y-%m-%d %H:%M:%S" >> .github/keepalive.log

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive.log
          # Commit only if there are changes, otherwise exit gracefully
          git commit -m "chore: automated keepalive to prevent inactivity disable" || echo "No changes to commit"
          git push
