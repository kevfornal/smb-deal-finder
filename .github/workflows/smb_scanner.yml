name: Daily SMB Deal Finder Scanner

on:
  schedule:
    # Runs daily at 11:00 UTC (7:00 AM EDT / 6:00 AM EST)
    - cron: '0 11 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  scan-deals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run SMB Finder Script
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          ACQUIRE_COOKIE: ${{ secrets.ACQUIRE_COOKIE }}
        run: python smb_finder.py

      - name: Commit and push updated smb_listings_history.json
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Create an empty JSON file if Python script didn't generate one yet
          if [ ! -f smb_listings_history.json ]; then
            echo "{}" > smb_listings_history.json
          fi

          git add smb_listings_history.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update smb_listings_history.json [skip ci]" && git push)
