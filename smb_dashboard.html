<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Acquisition Deal Flow Dashboard</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 40px; background: #f8f9fa; }
        h1 { color: #1a1a1a; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid #edf2f7; }
        th { background-color: #2d3748; color: white; }
        tr:hover { background-color: #f7fafc; }
        a { color: #3182ce; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <h1>🎯 Low-Down Business Acquisition Pipeline</h1>
    <table id="dealsTable">
        <thead>
            <tr>
                <th>Title</th>
                <th>Asking Price</th>
                <th>Cash Flow</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <script>
        async function fetchDeals() {
            const response = await fetch('./listings_history.json');
            const data = await response.json();
            const tbody = document.querySelector('#dealsTable tbody');
            tbody.innerHTML = '';

            Object.values(data).forEach(deal => {
                const row = `<tr>
                    <td>${deal.title}</td>
                    <td>${deal.price}</td>
                    <td>${deal.cash_flow}</td>
                    <td><a href="${deal.link}" target="_blank">View Listing →</a></td>
                </tr>`;
                tbody.innerHTML += row;
            });
        }
        fetchDeals();
    </script>
</body>
</html>
